# This manifest sets up a Kubernetes Service Account (KSA) and annotates it
# to link with a Google Service Account (GSA). This is the recommended way
# to provide GCP credentials to applications running on GKE (Workload Identity).
#
# Pre-requisites:
# 1. You must have a Google Service Account (GSA) created in your GCP project.
#    gcloud iam service-accounts create GSA_NAME \
#      --project="GCP_PROJECT_ID"
#
# 2. The GSA must have the 'roles/pubsub.publisher' role.
#    gcloud projects add-iam-policy-binding GCP_PROJECT_ID \
#      --member="serviceAccount:GSA_NAME@GCP_PROJECT_ID.iam.gserviceaccount.com" \
#      --role="roles/pubsub.publisher"
#
# 3. You must bind the KSA to the GSA.
#    gcloud iam service-accounts add-iam-policy-binding GSA_NAME@GCP_PROJECT_ID.iam.gserviceaccount.com \
#      --role="roles/iam.workloadIdentityUser" \
#      --member="serviceAccount:GCP_PROJECT_ID.svc.id.goog[NAMESPACE/KSA_NAME]"
#    (Replace NAMESPACE with 'default' and KSA_NAME with 'order-publisher-sa')

apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-publisher-sa
  namespace: default # Or your target namespace
  annotations:
    # Link this KSA to the GSA.
    # CHANGE_ME: Replace with your GCP Project ID and GSA name.
    iam.gke.io/gcp-service-account: GSA_NAME@GCP_PROJECT_ID.iam.gserviceaccount.com