# This Cloud Build pipeline builds the Docker image for the publisher,
# pushes it to Google Artifact Registry, and deploys it to a GKE cluster.
#
# To run this pipeline, you need a Cloud Build trigger.
# The following substitution variables are expected to be provided by the trigger:
# _GKE_CLUSTER: The name of your GKE cluster.
# _GKE_LOCATION: The location of your GKE cluster (e.g., us-central1).
# _GAR_LOCATION: The location of your Artifact Registry (e.g., us-central1).
# _REPOSITORY: The name of your Artifact Registry repository.
#
# The Cloud Build service account needs the following roles:
# - Artifact Registry Writer (roles/artifactregistry.writer)
# - Kubernetes Engine Developer (roles/container.developer)

steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Image'
    args:
      - 'build'
      - '-t'
      - '${_GAR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/order-publisher:$SHORT_SHA'
      - '.'

  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Image'
    args:
      - 'push'
      - '${_GAR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/order-publisher:$SHORT_SHA'

  # 3. Update Kubernetes manifests with the new image tag and project ID
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Update Manifests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Updating deployment.yaml with image and project ID..."
        sed -i "s|gcr.io/your-gcp-project-id/order-publisher:latest|${_GAR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/order-publisher:$SHORT_SHA|g" k8s/deployment.yaml
        sed -i "s|your-gcp-project-id|$PROJECT_ID|g" k8s/deployment.yaml
        echo "Manifests updated."

  # 4. Get GKE credentials
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Get GKE Credentials'
    entrypoint: 'gcloud'
    args:
      - 'container'
      - 'clusters'
      - 'get-credentials'
      - '${_GKE_CLUSTER}'
      - '--location'
      - '${_GKE_LOCATION}'

  # 5. Deploy to GKE
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'Deploy to GKE'
    args:
      - 'apply'
      - '-f'
      - 'k8s/'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_GKE_LOCATION}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER}'

images:
  - '${_GAR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/order-publisher:$SHORT_SHA'